<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fdf8ec"/>
      <stop offset="70%" stop-color="#f3d88a"/>
      <stop offset="100%" stop-color="#c98a16"/>
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2d0e"/>
      <stop offset="100%" stop-color="#2c1810"/>
